# Sympathetic cracking between two stacked pellets.
#
# Pellet 0 (bottom) carries a weak flaw on the radial plane theta = 0 near its upper end face, so it
# cracks first at a known angle; pellet 1 (top) has potential radial cracks at EVERY element boundary
# so its cracks can form at any angle. The question is whether pellet 1 cracks preferentially in line
# with the crack in pellet 0, and how interface pressure, friction and contact area control it.
#
# Boundary conditions (designed to constrain without over-constraining):
#  * bottom face of pellet 0: frictionless roller (u_z = 0) - a symmetry plane of an infinite stack;
#  * in-plane rigid-body motion: three statically determinate pins on one region (no reactions
#    for self-equilibrated loads; the history reports the pin reaction as a check);
#  * top face of pellet 1: prescribed axial pressure (plenum-spring load), applied first, then held;
#  * pellet-pellet interface: penalty contact + Coulomb friction, solid + gas conductance; contact
#    restricted to an annulus (dish) via interface.contact_fraction or interface.dish_radius.
# Alternative: boundary.top = displacement (rigid platen) to impose closure and measure the force;
# boundary.bottom = platen for a frictional bottom support.

[geometry]
radius = 4.67e-3
height = 14.0e-3
n_pellets = 2

[mesh]
nr = 10
ntheta = 32
nz = 16

[cracks]
radial_planes = all
n_slabs = 4
circumferential_radii = 0.5

[strength]
mean = 130e6
weibull_modulus = 8

[toughness]
mean = 4.0
weibull_modulus = 8

[weibull]
correlation_length = 0.5e-3
toughness_strength_correlation = 0.5
seed = 11
# x, y, z, radius, strength factor, toughness factor : a weak flaw in pellet 0 at theta = 0
flaws = 4.4e-3, 0.0, 11.5e-3, 1.5e-3, 0.4, 0.5

[cohesive]
stiffness = 1.0e16
viscosity = 1e-4
crack_face_friction = 0.5

[interface]
type = contact
friction = 0.5            # Coulomb coefficient, or 'stick'
contact_fraction = 0.75   # nominal contact-area fraction (annulus r >= R sqrt(1 - f))
dish_depth = 0.2e-3

[thermal]
convection_coefficient = 5000
coolant_temperature = 0, 500
pellet_contact_conductance = 5e4

[loading]
power_history_W_per_cm = 0, 0; 10, 0; 310, 300; 400, 300

[boundary]
bottom = roller
top = pressure
top_pressure = 0, 0; 10, 10e6; 400, 10e6

[time]
end = 400
dt_initial = 1.0
dt_max = 5.0

[output]
directory = runs/two_pellet_sympathetic
times = 10, 100, 200, 310, 400
