# Single UO2 pellet, Williamson & Knoll (SMiRT-20, 2009) geometry and loading,
# coarse 3D mesh, Weibull strength + toughness on a correlated field.
# Rise to 240 W/cm in 200 s (the paper's power-up step).
#   ./build/pelletcz inputs/single_pellet_demo.ini

[geometry]
radius = 4.67e-3          # m (diameter 9.34 mm)
height = 14.0e-3          # m
n_pellets = 1

[mesh]
nr = 8                    # radial elements (paper used dr = 0.036 mm in 2D, 0.24 mm in 3D)
ntheta = 32
nz = 16                   # per pellet; a multiple of n_slabs
radial_grading = 1.0

[cracks]
radial_planes = 8         # 0, >=2, or 'all' (a plane at every element boundary)
n_slabs = 8               # 7 transverse planes
circumferential_radii = 0.25, 0.5, 0.75

[material]                # UO2, 95 % TD (Olander 1976; Fink 2000; Lucuta 1996; MATPRO)
youngs_modulus = 219e9
poisson_ratio = 0.345
thermal_expansion = 10.0e-6
reference_temperature = 293.15

[strength]                # cohesive strength sigma_t [Pa]
distribution = weibull
mean = 130e6
weibull_modulus = 8

[toughness]               # cohesive fracture energy Gc [J/m2]
distribution = weibull
mean = 4.0
weibull_modulus = 8

[weibull]
correlation_length = 0.5e-3   # m; 0 = independent per interface element
toughness_strength_correlation = 0.5
seed = 1

[cohesive]
stiffness = 1.0e16        # K_n [N/m3]
softening = linear
viscosity = 1e-4          # s
crack_face_friction = 0.0

[thermal]
convection_coefficient = 5000
coolant_temperature = 0, 500
crack_emissivity = 0.8
crack_roughness = 1e-6

[loading]
power_history_W_per_cm = 0, 0; 200, 240

[boundary]
bottom = roller
top = free

[time]
end = 200
dt_initial = 1.0
dt_max = 3600
max_power_change = 0.02
max_damage_increment = 0.5

[solver]
newton_tolerance = 5e-4

[output]
directory = runs/single_pellet_demo
times = 50, 100, 150, 200
on_crack_area_growth = 10e-6  # also write fields every +10 mm2 of crack area
